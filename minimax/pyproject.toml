[project]
name = "sddctx"
version = "0.1.0"
description = "SDD context module for the MiniMax x OceanBase challenge: spec/code/test retrieval on seekdb with PowerContext task state"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "powercontext[cli,server,seekdb]==1.4.0",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.scripts]
sddctx = "sddctx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sddctx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
