    - data:
        code: "import json\n\n\ndef _loads(text):\n    try:\n        return json.loads(text\
          \ or \"{}\")\n    except Exception:\n        return {}\n\n\ndef main(lore_body:\
          \ str, memory_body: str, state_body: str) -> dict:\n    lore = _loads(lore_body)\n\
          \    memory = _loads(memory_body)\n    state = _loads(state_body)\n\n  \
          \  # 1) seekdb 检索结果（侧车已经渲染好 context）\n    lore_ctx = lore.get(\"context\"\
          ) or \"\"\n    if not lore_ctx:\n        hits = lore.get(\"hits\") or []\n\
          \        lore_ctx = \"\\n\".join(\n            \"- [\" + str(h.get(\"kind\"\
          )) + \"] \" + str(h.get(\"title\")) + \"：\" + str(h.get(\"content\"))\n\
          \            for h in hits\n        )\n\n    # 2) PowerContext 召回结果\n  \
          \  results = ((memory.get(\"data\") or {}).get(\"results\")) or []\n   \
          \ lines = []\n    for r in results:\n        content = str(r.get(\"content\"\
          , \"\"))\n        score = r.get(\"score\")\n        if isinstance(score,\
          \ (int, float)):\n            lines.append(\"- \" + content + \"（相似度 \"\
          \ + str(round(float(score), 3)) + \"）\")\n        else:\n            lines.append(\"\
          - \" + content)\n    memory_ctx = \"\\n\".join(lines) if lines else \"（关于这个玩家，你还什么都没记住）\"\
          \n\n    # 3) 账本状态\n    state_ctx = (\n        \"好感度=\" + str(state.get(\"\
          affection\", 0))\n        + \"，欠账=\" + str(state.get(\"balance\", 0)) +\
          \ \" 元\"\n        + \"，已完成整蛊=\" + str(state.get(\"pranks_done\", 0)) + \"\
          \ 件\"\n        + \"，章节=\" + str(state.get(\"chapter\", \"第一章·夜来客\"))\n \
          \       + \"，黑名单=\" + (\"是\" if state.get(\"blacklist\") else \"否\")\n \
          \   )\n\n    return {\"lore_ctx\": lore_ctx, \"memory_ctx\": memory_ctx,\
          \ \"state_ctx\": state_ctx}\n"
        code_language: python3
        desc: 把三个 HTTP 节点的 JSON 压成三段可直接进 prompt 的文本
        outputs:
          lore_ctx:
            children: null
            type: string
          memory_ctx:
            children: null
            type: string
          state_ctx:
            children: null
            type: string
        selected: false
        title: 汇总上下文
        type: code
        variables:
