    - data:
        code: "import json\nimport re\n\n\ndef _loads(text):\n    try:\n        return\
          \ json.loads(text or \"{}\")\n    except Exception:\n        return {}\n\
          \n\ndef _num(value, default=0.0):\n    try:\n        return float(value)\n\
          \    except Exception:\n        return default\n\n\ndef _bar(affection:\
          \ int) -> str:\n    filled = int(round((affection + 100) / 200 * 10))\n\
          \    filled = max(0, min(10, filled))\n    return \"█\" * filled + \"░\"\
          \ * (10 - filled)\n\n\ndef main(role_text: str, state_body: str, query:\
          \ str) -> dict:\n    m = re.search(r\"\\{[\\s\\S]*\\}\", role_text or \"\
          \")\n    role = _loads(m.group(0)) if m else {}\n    state = _loads(state_body)\n\
          \n    affection = int(_num(state.get(\"affection\", 0)))\n    balance =\
          \ round(_num(state.get(\"balance\", 0)), 2)\n    blacklist = int(_num(state.get(\"\
          blacklist\", 0)))\n    pranks = int(_num(state.get(\"pranks_done\", 0)))\n\
          \    old_chapter = str(state.get(\"chapter\", \"第一章·夜来客\"))\n\n    d_aff\
          \ = int(_num(role.get(\"affection_delta\", 0)))\n    d_bal = round(_num(role.get(\"\
          balance_delta\", 0)), 2)\n    if str(role.get(\"prank_done\", \"0\")).strip().lower()\
          \ in (\"1\", \"true\"):\n        pranks += 1\n\n    affection = max(-100,\
          \ min(100, affection + d_aff))\n    balance = round(balance + d_bal, 2)\n\
          \    if affection <= -50:\n        blacklist = 1\n\n    if affection >=\
          \ 85 and pranks >= 4:\n        chapter = \"第四章·合伙人\"\n    elif affection\
          \ >= 60:\n        chapter = \"第三章·熟客\"\n    elif affection >= 30:\n    \
          \    chapter = \"第二章·常客\"\n    else:\n        chapter = \"第一章·夜来客\"\n\n\
          \    # 只有\"章节推进\"或\"被拉黑\"时才播报结局/里程碑\n    milestone = chapter != old_chapter\
          \ and chapter in (\n        \"第二章·常客\", \"第三章·熟客\", \"第四章·合伙人\"\n    )\n\
          \    blacklisted = affection <= -50\n    ending_ready = 1 if (milestone\
          \ or blacklisted) else 0\n    ending_aff = affection if ending_ready else\
          \ 9999\n\n    reply = str(role.get(\"reply\", \"\")).strip()\n    if not\
          \ reply:\n        reply = \"（阿夜翻了翻便签本，发现自己对这位客人……一无所知。）\"\n\n    memory_item\
          \ = str(role.get(\"memory_item\", \"\")).strip()\n    if not memory_item:\n\
          \        memory_item = \"[互动] 玩家说：\" + (query or \"\")[:30]\n\n    return\
          \ {\n        \"affection\": affection,\n        \"balance\": balance,\n\
          \        \"blacklist\": blacklist,\n        \"pranks_done\": pranks,\n \
          \       \"chapter\": chapter,\n        \"reply\": reply,\n        \"memory_item\"\
          : memory_item,\n        \"hit_event\": str(role.get(\"hit_event\", \"\"\
          )).strip(),\n        \"action\": str(role.get(\"action\", \"\")).strip(),\n\
          \        \"affection_delta\": d_aff,\n        \"affection_bar\": _bar(affection),\n\
          \        \"ending_aff\": ending_aff,\n    }\n"
