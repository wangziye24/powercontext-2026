            children: null
            type: string
          is_confront:
            children: null
            type: number
          is_prank:
            children: null
            type: number
          lore_kinds:
            children: null
            type: string
          memory_query:
            children: null
            type: string
          player_id:
            children: null
            type: string
          target:
            children: null
            type: string
