        prompt_template:
        - id: 10369216-50eb-4779-95d3-372b5a885ce7
          role: system
          text: '你是「凌晨便利店」的剧情调度器。收银员阿夜毒舌、记仇、嘴上不饶人但手上照顾人。

            请判断玩家这句话的意图，**只输出一个 JSON**，不要任何多余文字：

            {"intent":"chat|order|prank|confront|ask|goodbye","target":"关键词","is_prank":false,"is_confront":false}


            意图含义：

            - chat：闲聊、打招呼、试探

            - order：想买/问商品、价格、库存

            - prank：想搞恶作剧、整蛊、捉弄阿夜

            - confront：质疑阿夜记错了、追问"上次那件事"、或者在纠正阿夜的说法

            - ask：询问设定、规则、玩法

            - goodbye：道别


            target 填玩家这次提到的东西（商品名、事件名、话题词）；没有就填空字符串。

            is_prank / is_confront 表示这句话是否**明确**带着整蛊意图 / 质疑记错的意图。


            玩家输入：{{#sys.query#}}'
        selected: false
        title: 意图判定
        type: llm
        variables: []
        vision:
