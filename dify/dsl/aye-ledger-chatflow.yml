    - data:
        code: "import json\nimport re\n\n\ndef _parse(text):\n    \"\"\"从 LLM 输出里抠出\
          \ JSON（容忍 ```json 包裹与前后废话）。\"\"\"\n    if not text:\n        return {}\n\
          \    m = re.search(r\"\\{[\\s\\S]*\\}\", text)\n    if not m:\n        return\
          \ {}\n    try:\n        return json.loads(m.group(0))\n    except Exception:\n\
          \        return {}\n\n\ndef main(role_text: str, player_id: str, sys_user_id:\
          \ str, query: str) -> dict:\n    data = _parse(role_text)\n    intent =\
          \ str(data.get(\"intent\", \"chat\")).strip().lower()\n    if intent not\
          \ in (\"chat\", \"order\", \"prank\", \"confront\", \"ask\", \"goodbye\"\
          ):\n        intent = \"chat\"\n    target = str(data.get(\"target\", \"\"\
          )).strip()\n    truthy = (True, \"true\", \"True\", \"1\", 1)\n    is_prank\
          \ = 1 if (data.get(\"is_prank\") in truthy or intent == \"prank\") else\
          \ 0\n    is_confront = 1 if (data.get(\"is_confront\") in truthy or intent\
          \ == \"confront\") else 0\n\n    # 玩家标识：start.player_id > sys.user_id >\
          \ demo\n    pid = (player_id or \"\").strip() or (sys_user_id or \"\").strip()\
          \ or \"player_demo\"\n\n    # 根据意图决定去 seekdb 检索哪一类设定\n    if intent in (\"\
          order\", \"ask\"):\n        kinds = \"profile,item\"\n    elif intent ==\
          \ \"prank\":\n        kinds = \"prank,profile,item\"\n    elif intent ==\
          \ \"confront\":\n        kinds = \"rumor,profile,prank\"\n    else:\n  \
          \      kinds = \"profile,item,rumor\"\n\n    topic = target or (query or\
          \ \"\")[:30]\n    memory_query = \"玩家\" + pid + \" 关于\" + topic + \" 的偏好\
          \ 口味 恶作剧 口头禅 历史互动\"\n\n    return {\n        \"intent\": intent,\n     \
          \   \"target\": target,\n        \"lore_kinds\": kinds,\n        \"is_prank\"\
          : is_prank,\n        \"is_confront\": is_confront,\n        \"player_id\"\
          : pid,\n        \"memory_query\": memory_query,\n    }\n"
        code_language: python3
        desc: 把 LLM 的 JSON 变成后面节点能用的变量
        outputs:
