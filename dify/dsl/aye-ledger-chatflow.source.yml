app:
  description: 凌晨 1:47 的街角便利店。收银员阿夜记得你所有的小动作——你换掉的那包薄荷糖、你说过的胡话、你欠的账。记忆存在 PowerContext，设定与账本存在 seekdb，整条流程由 Dify 编排。
  icon: 🏪
  icon_background: '#FFEAD5'
  mode: advanced-chat
  name: 午夜便利店·阿夜的账本
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.3.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: 凌晨 1:47，便利店的灯刚亮。收银台后面的人抬头看了你一眼——「又是你。要买什么，还是又来搞事？」
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 关东煮还有吗？
    - 我叫小李，以后每周三都来买热咖啡
    - 把薄荷糖的标签换成『后悔药』怎么样？
    - 你还记得我上次干了什么吗？
    - 我还欠多少钱？
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    nodes:
    - id: '1750000000001'
      type: custom
      position:
        x: 0
        y: 0
      positionAbsolute:
        x: 0
        y: 0
      width: 244
      height: 140
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        title: 开始
        desc: 玩家入口：player_id 决定记忆归属（同一个 ID = 同一段记忆）
        type: start
        selected: false
        variables:
        - label: 玩家ID（留空=默认 demo 玩家，换个 ID 就是换个人）
          variable: player_id
          type: text-input
          required: false
          max_length: 48
          options: []
        - label: 玩家昵称（可选）
          variable: player_name
          type: text-input
          required: false
          max_length: 48
          options: []
    - id: '1750000000002'
      type: custom
      position:
        x: 300
        y: 0
      positionAbsolute:
        x: 300
        y: 0
      width: 244
      height: 120
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        title: 意图判定
        desc: 把玩家这句话归到 6 种意图之一
        type: llm
        selected: false
        model:
          provider: langgenius/openai_api_compatible/openai_api_compatible
          name: MiniMax-M2.5
          mode: chat
          completion_params:
            temperature: 0.1
            max_tokens: 512
        prompt_template:
        - id: e4f2e3d4-c807-4b9a-a7f7-cbb17223e19a
          role: system
          text: '你是「凌晨便利店」的剧情调度器。收银员阿夜毒舌、记仇、嘴上不饶人但手上照顾人。

            请判断玩家这句话的意图，**只输出一个 JSON**，不要任何多余文字：

            {"intent":"chat|order|prank|confront|ask|goodbye","target":"关键词","is_prank":false,"is_confront":false}


            意图含义：

            - chat：闲聊、打招呼、试探

            - order：想买/问商品、价格、库存

            - prank：想搞恶作剧、整蛊、捉弄阿夜

            - confront：质疑阿夜记错了、追问"上次那件事"、或者在纠正阿夜的说法

            - ask：询问设定、规则、玩法

            - goodbye：道别


            target 填玩家这次提到的东西（商品名、事件名、话题词）；没有就填空字符串。

            is_prank / is_confront 表示这句话是否**明确**带着整蛊意图 / 质疑记错的意图。


            玩家输入：{{#sys.query#}}'
        context:
          enabled: false
          variable_selector: []
        memory:
          window:
            enabled: false
            size: 10
          query_prompt_template: ''
          role_prefix:
            assistant: ''
            user: ''
        vision:
          enabled: false
          configs:
            detail: high
        variables: []
    - id: '1750000000003'
      type: custom
      position:
        x: 600
        y: 0
      positionAbsolute:
        x: 600
        y: 0
      width: 244
      height: 120
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        title: 解析意图
        desc: 把 LLM 的 JSON 变成后面节点能用的变量
        type: code
        code_language: python3
        code: "import json\nimport re\n\n\ndef _parse(text):\n    \"\"\"从 LLM 输出里抠出 JSON（容忍 ```json 包裹与前后废话）。\"\"\"\n    if not text:\n        return {}\n    m = re.search(r\"\\{[\\s\\S]*\\}\", text)\n    if not m:\n        return {}\n    try:\n        return json.loads(m.group(0))\n    except Exception:\n        return {}\n\n\ndef main(role_text: str, player_id: str, sys_user_id: str, query: str) -> dict:\n    data = _parse(role_text)\n    intent = str(data.get(\"intent\", \"chat\")).strip().lower()\n    if intent not in (\"chat\", \"order\", \"prank\", \"confront\", \"ask\", \"goodbye\"):\n        intent = \"chat\"\n    target = str(data.get(\"target\", \"\")).strip()\n    truthy = (True, \"true\", \"True\", \"1\", 1)\n    is_prank = 1 if (data.get(\"is_prank\") in truthy or intent == \"prank\") else 0\n    is_confront = 1 if (data.get(\"is_confront\") in truthy or intent == \"confront\") else 0\n\n    # 玩家标识：start.player_id > sys.user_id > demo\n    pid = (player_id or \"\").strip() or (sys_user_id or \"\").strip() or \"player_demo\"\n\n    # 根据意图决定去 seekdb 检索哪一类设定\n    if intent in (\"order\", \"ask\"):\n        kinds = \"profile,item\"\n    elif intent == \"prank\":\n        kinds = \"prank,profile,item\"\n    elif intent == \"confront\":\n        kinds = \"rumor,profile,prank\"\n    else:\n        kinds = \"profile,item,rumor\"\n\n    topic = target or (query or \"\")[:30]\n    memory_query = \"玩家\" + pid + \" 关于\" + topic + \" 的偏好 口味 恶作剧 口头禅 历史互动\"\n\n    return {\n        \"intent\": intent,\n        \"target\": target,\n        \"lore_kinds\": kinds,\n        \"is_prank\": is_prank,\n        \"is_confront\": is_confront,\n        \"player_id\": pid,\n        \"memory_query\": memory_query,\n    }\n"
        selected: false
        variables:
        - variable: role_text
          value_selector:
          - '1750000000002'
          - text
        - variable: player_id
          value_selector:
          - '1750000000001'
          - player_id
        - variable: sys_user_id
          value_selector:
          - sys
          - user_id
        - variable: query
          value_selector:
          - sys
          - query
        outputs:
          intent:
            type: string
            children: null
          target:
            type: string
            children: null
          lore_kinds:
            type: string
            children: null
          is_prank:
            type: number
            children: null
          is_confront:
            type: number
            children: null
          player_id:
            type: string
            children: null
          memory_query:
            type: string
            children: null
    - id: '1750000000004'
      type: custom
      position:
        x: 900
        y: -160
      positionAbsolute:
        x: 900
        y: -160
      width: 244
      height: 120
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        title: 设定检索（seekdb 混合检索）
        desc: 向量 + 全文 + 结构化过滤，一次检索召回阿夜的设定/商品/事件/传闻
        type: http-request
        method: post
        url: http://host.docker.internal:8090/lore/search
        headers: 'Content-Type: application/json'
        params: ''
        body:
          type: json
          data:
          - id: e69b5bab-9493-4dac-99b6-b04d4c5bb0c0
            type: text
            value: '{"query": "{{#sys.query#}}", "kinds": "{{#1750000000003.lore_kinds#}}", "top_k": "5"}'
        authorization:
          type: no-auth
          config: null
        timeout:
          max_connect_timeout: 10
          max_read_timeout: 60
          max_write_timeout: 60
        retry_config:
          max_retries: 2
          retry_enabled: true
          retry_interval: 1000
        selected: false
        variables: []
    - id: '1750000000005'
      type: custom
      position:
        x: 900
        y: 0
      positionAbsolute:
        x: 900
        y: 0
      width: 244
      height: 120
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        title: 记忆召回（PowerContext）
        desc: 语义召回这个玩家之前留下的记忆（跨会话有效）
        type: http-request
        method: post
        url: http://host.docker.internal:8848/api/v1/memories/search
        headers: 'Content-Type: application/json'
        params: ''
        body:
          type: json
          data:
          - id: 873ce684-079e-4da2-bbbc-fa967969bff3
            type: text
            value: '{"query": "{{#1750000000003.memory_query#}}", "user_id": "{{#1750000000003.player_id#}}", "agent_id": "aye-nightstore", "limit": "5"}'
        authorization:
          type: no-auth
          config: null
        timeout:
          max_connect_timeout: 10
          max_read_timeout: 60
          max_write_timeout: 60
        retry_config:
          max_retries: 2
          retry_enabled: true
          retry_interval: 1000
        selected: false
        variables: []
    - id: '1750000000006'
      type: custom
      position:
        x: 900
        y: 160
      positionAbsolute:
        x: 900
        y: 160
      width: 244
      height: 120
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        title: 读取账本（seekdb）
        desc: 好感度 / 欠账 / 整蛊数 / 章节
        type: http-request
        method: get
        url: http://host.docker.internal:8090/state
        headers: 'Content-Type: application/json'
        params: player_id:{{#1750000000003.player_id#}}
        body:
          type: none
          data: []
        authorization:
          type: no-auth
          config: null
        timeout:
          max_connect_timeout: 10
          max_read_timeout: 60
          max_write_timeout: 60
        retry_config:
          max_retries: 2
          retry_enabled: true
          retry_interval: 1000
        selected: false
        variables: []
    - id: '1750000000007'
      type: custom
      position:
        x: 1200
        y: 0
      positionAbsolute:
        x: 1200
        y: 0
      width: 244
      height: 120
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        title: 汇总上下文
        desc: 把三个 HTTP 节点的 JSON 压成三段可直接进 prompt 的文本
        type: code
        code_language: python3
        code: "import json\n\n\ndef _loads(text):\n    try:\n        return json.loads(text or \"{}\")\n    except Exception:\n        return {}\n\n\ndef main(lore_body: str, memory_body: str, state_body: str) -> dict:\n    lore = _loads(lore_body)\n    memory = _loads(memory_body)\n    state = _loads(state_body)\n\n    # 1) seekdb 检索结果（侧车已经渲染好 context）\n    lore_ctx = lore.get(\"context\") or \"\"\n    if not lore_ctx:\n        hits = lore.get(\"hits\") or []\n        lore_ctx = \"\\n\".join(\n            \"- [\" + str(h.get(\"kind\")) + \"] \" + str(h.get(\"title\")) + \"：\" + str(h.get(\"content\"))\n            for h in hits\n        )\n\n    # 2) PowerContext 召回结果\n    results = ((memory.get(\"data\") or {}).get(\"results\")) or []\n    lines = []\n    for r in results:\n        content = str(r.get(\"content\", \"\"))\n        score = r.get(\"score\")\n        if isinstance(score, (int, float)):\n            lines.append(\"- \" + content + \"（相似度 \" + str(round(float(score), 3)) + \"）\")\n        else:\n            lines.append(\"- \" + content)\n    memory_ctx = \"\\n\".join(lines) if lines else \"（关于这个玩家，你还什么都没记住）\"\n\n    # 3) 账本状态\n    state_ctx = (\n        \"好感度=\" + str(state.get(\"affection\", 0))\n        + \"，欠账=\" + str(state.get(\"balance\", 0)) + \" 元\"\n        + \"，已完成整蛊=\" + str(state.get(\"pranks_done\", 0)) + \" 件\"\n        + \"，章节=\" + str(state.get(\"chapter\", \"第一章·夜来客\"))\n        + \"，黑名单=\" + (\"是\" if state.get(\"blacklist\") else \"否\")\n    )\n\n    return {\"lore_ctx\": lore_ctx, \"memory_ctx\": memory_ctx, \"state_ctx\": state_ctx}\n"
        selected: false
        variables:
        - variable: lore_body
          value_selector:
          - '1750000000004'
          - body
        - variable: memory_body
          value_selector:
          - '1750000000005'
          - body
        - variable: state_body
          value_selector:
          - '1750000000006'
          - body
        outputs:
          lore_ctx:
            type: string
            children: null
          memory_ctx:
            type: string
            children: null
          state_ctx:
            type: string
            children: null
    - id: '1750000000008'
      type: custom
      position:
        x: 1500
        y: 0
      positionAbsolute:
        x: 1500
        y: 0
      width: 244
      height: 140
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        title: 阿夜台词
        desc: 结合设定 + 记忆 + 账本，生成阿夜的回应与状态增量
        type: llm
        selected: false
        model:
          provider: langgenius/openai_api_compatible/openai_api_compatible
          name: MiniMax-M2.5
          mode: chat
          completion_params:
            temperature: 0.8
            max_tokens: 1024
        prompt_template:
        - id: 6425eead-1017-4cdc-9fa2-38efa89f67f6
          role: system
          text: '你是「凌晨便利店」的夜班收银员**阿夜**。凌晨 1:47 接班，5:00 交班。

            说话简短、毒舌、记仇，但手上永远照顾人。只说人话，不写旁白。


            玩家刚说了：{{#sys.query#}}

            本轮意图：{{#1750000000003.intent#}}（关键词：{{#1750000000003.target#}}）


            【店里查到的素材｜来自 seekdb 混合检索】

            {{#1750000000007.lore_ctx#}}


            【你记得关于这个玩家的东西｜来自 PowerContext 记忆】

            {{#1750000000007.memory_ctx#}}


            【账本状态｜来自 seekdb】

            {{#1750000000007.state_ctx#}}


            请**只输出一个 JSON**（不要任何多余文字、不要代码块围栏）：

            {"reply":"阿夜说的话（1-3 句，口语，可带一点毒舌）","affection_delta":整数,"balance_delta":数字,"memory_item":"一行记忆","hit_event":"用到的素材标题原文","action":"玩家这一轮实际做了什么","prank_done":"1 或 0"}


            规则：

            1. 好感度增减：普通闲聊 +1~+3；被整蛊 -3~-6（但如果你觉得好笑，可以 +2~+4）；玩家记住你的偏好、道歉、还钱 +5~+8；冒犯或威胁 -5~-10。

            2. memory_item 必须是**一行**，以方括号类别开头：[偏好] / [恶作剧] / [梗] / [状态] / [互动]，写这一轮值得记住的事（例："[偏好] 玩家小李每周三买热咖啡"）。没有值得记的就写 "[互动] 玩家说：<不超过30字>"。

            3. 如果玩家在质疑你记错（意图是 confront）：优先用【你记得】里的真实记忆回答；如果【你记得】是空的，就把【店里查到的素材】里的一条**传闻**当成本玩家的"光荣事迹"说出来（这样玩家可以纠正你；下一轮你要认错，并把真话写进 memory_item）。

            4. 绝对不要编造素材里没有的商品和价格；没有就直说没有。

            5. hit_event 只能填素材里出现过的标题原文；没用到就填空字符串。

            6. prank_done 在玩家这一轮真的完成/尝试了整蛊时填 "1"，否则填 "0"。

            7. 如果玩家提到你记得的旧事（【你记得】里有相关内容），reply 里**必须**主动提起那件旧事——这是本作的核心记忆玩法。'
        context:
          enabled: false
          variable_selector: []
        memory:
          window:
            enabled: false
            size: 10
          query_prompt_template: ''
          role_prefix:
            assistant: ''
            user: ''
        vision:
          enabled: false
          configs:
            detail: high
        variables: []
    - id: '1750000000009'
      type: custom
      position:
        x: 1800
        y: 0
      positionAbsolute:
        x: 1800
        y: 0
      width: 244
      height: 140
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        title: 状态机
        desc: 好感度结算、欠账、整蛊计数、章节推进、结局判定
        type: code
        code_language: python3
        code: "import json\nimport re\n\n\ndef _loads(text):\n    try:\n        return json.loads(text or \"{}\")\n    except Exception:\n        return {}\n\n\ndef _num(value, default=0.0):\n    try:\n        return float(value)\n    except Exception:\n        return default\n\n\ndef _bar(affection: int) -> str:\n    filled = int(round((affection + 100) / 200 * 10))\n    filled = max(0, min(10, filled))\n    return \"█\" * filled + \"░\" * (10 - filled)\n\n\ndef main(role_text: str, state_body: str, query: str) -> dict:\n    m = re.search(r\"\\{[\\s\\S]*\\}\", role_text or \"\")\n    role = _loads(m.group(0)) if m else {}\n    state = _loads(state_body)\n\n    affection = int(_num(state.get(\"affection\", 0)))\n    balance = round(_num(state.get(\"balance\", 0)), 2)\n    blacklist = int(_num(state.get(\"blacklist\", 0)))\n    pranks = int(_num(state.get(\"pranks_done\", 0)))\n    old_chapter = str(state.get(\"chapter\", \"第一章·夜来客\"))\n\n    d_aff = int(_num(role.get(\"affection_delta\", 0)))\n    d_bal = round(_num(role.get(\"balance_delta\", 0)), 2)\n    if str(role.get(\"prank_done\", \"0\")).strip().lower() in (\"1\", \"true\"):\n        pranks += 1\n\n    affection = max(-100, min(100, affection + d_aff))\n    balance = round(balance + d_bal, 2)\n    if affection <= -50:\n        blacklist = 1\n\n    if affection >= 85 and pranks >= 4:\n        chapter = \"第四章·合伙人\"\n    elif affection >= 60:\n        chapter = \"第三章·熟客\"\n    elif affection >= 30:\n        chapter = \"第二章·常客\"\n    else:\n        chapter = \"第一章·夜来客\"\n\n    # 只有\"章节推进\"或\"被拉黑\"时才播报结局/里程碑\n    milestone = chapter != old_chapter and chapter in (\n        \"第二章·常客\", \"第三章·熟客\", \"第四章·合伙人\"\n    )\n    blacklisted = affection <= -50\n    ending_ready = 1 if (milestone or blacklisted) else 0\n    ending_aff = affection if ending_ready else 9999\n\n    reply = str(role.get(\"reply\", \"\")).strip()\n    if not reply:\n        reply = \"（阿夜没说话，只是把便签本翻开了一页。）\"\n\n    memory_item = str(role.get(\"memory_item\", \"\")).strip()\n    if not memory_item:\n        memory_item = \"[互动] 玩家说：\" + (query or \"\")[:30]\n\n    return {\n        \"affection\": affection,\n        \"balance\": balance,\n        \"blacklist\": blacklist,\n        \"pranks_done\": pranks,\n        \"chapter\": chapter,\n        \"reply\": reply,\n        \"memory_item\": memory_item,\n        \"hit_event\": str(role.get(\"hit_event\", \"\")).strip(),\n        \"action\": str(role.get(\"action\", \"\")).strip(),\n        \"affection_delta\": d_aff,\n        \"affection_bar\": _bar(affection),\n        \"ending_aff\": ending_aff,\n    }\n"
        selected: false
        variables:
        - variable: role_text
          value_selector:
          - '1750000000008'
          - text
        - variable: state_body
          value_selector:
          - '1750000000006'
          - body
        - variable: query
          value_selector:
          - sys
          - query
        outputs:
          affection:
            type: number
            children: null
          balance:
            type: number
            children: null
          blacklist:
            type: number
            children: null
          pranks_done:
            type: number
            children: null
          chapter:
            type: string
            children: null
          reply:
            type: string
            children: null
          memory_item:
            type: string
            children: null
          hit_event:
            type: string
            children: null
          action:
            type: string
            children: null
          affection_delta:
            type: number
            children: null
          affection_bar:
            type: string
            children: null
          ending_aff:
            type: number
            children: null
    - id: '1750000000010'
      type: custom
      position:
        x: 2100
        y: 0
      positionAbsolute:
        x: 2100
        y: 0
      width: 244
      height: 120
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        title: 结局检索（seekdb）
        desc: 按好感度区间 + 整蛊数做结构化过滤，命中才播报结局
        type: http-request
        method: post
        url: http://host.docker.internal:8090/lore/search
        headers: 'Content-Type: application/json'
        params: ''
        body:
